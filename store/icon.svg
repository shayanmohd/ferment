<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="clay" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#A24A16"/>
      <stop offset="0.52" stop-color="#77330E"/>
      <stop offset="1" stop-color="#421808"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.62" r="0.56">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#F0A62F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F0A62F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDD95"/>
      <stop offset="0.42" stop-color="#F5B341"/>
      <stop offset="1" stop-color="#D2791A"/>
    </linearGradient>
    <radialGradient id="inner" cx="0.5" cy="0.74" r="0.6">
      <stop offset="0" stop-color="#FFF6DC" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FFF6DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E4C0"/>
      <stop offset="1" stop-color="#C29A5E"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.13"/>
    </linearGradient>

    <clipPath id="inside">
      <path d="M41 37c0 4-7 5.5-7 13v22a11 11 0 0 0 11 11h18a11 11 0 0 0 11-11V50c0-7.5-7-9-7-13z"/>
    </clipPath>
    <filter id="drop" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.6"/>
      <feOffset dy="3"/>
      <feFlood flood-color="#311204" flood-opacity="0.55"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloom" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
  </defs>

  <g id="bg">
    <rect width="108" height="108" fill="url(#clay)"/>
    <rect width="108" height="108" fill="url(#lamp)"/>
    <circle cx="26" cy="24" r="1.5" fill="#FFE3B4" opacity="0.30"/>
    <circle cx="84" cy="19" r="1.1" fill="#FFE3B4" opacity="0.24"/>
    <circle cx="90" cy="86" r="1.7" fill="#FFE3B4" opacity="0.20"/>
    <circle cx="18" cy="88" r="1.2" fill="#FFE3B4" opacity="0.18"/>
  </g>

  <g id="fg">
    <!-- the glow the jar throws, behind the glass -->
    <ellipse cx="54" cy="70" rx="19" ry="17" fill="#FFC55E" opacity="0.72" filter="url(#bloom)"/>

    <g filter="url(#drop)">
      <!-- lid -->
      <rect x="40" y="25" width="28" height="7.4" rx="3" fill="url(#cap)"/>
      <rect x="43" y="26.6" width="19" height="1.8" rx="0.9" fill="#FFFDF4" opacity="0.6"/>
      <!-- neck -->
      <rect x="42.6" y="32" width="22.8" height="5.6" rx="1.6" fill="#F7E7C8" opacity="0.34"/>
      <!-- glass -->
      <path d="M41 37c0 4-7 5.5-7 13v22a11 11 0 0 0 11 11h18a11 11 0 0 0 11-11V50c0-7.5-7-9-7-13z" fill="url(#pane)"/>

      <g clip-path="url(#inside)">
        <rect x="30" y="55" width="48" height="35" fill="url(#brine)"/>
        <ellipse cx="54" cy="74" rx="21" ry="15" fill="url(#inner)"/>
        <!-- bubbles rising out of the ferment -->
        <circle cx="45" cy="72" r="3.1" fill="#FFFBEE" opacity="0.94"/>
        <circle cx="61" cy="66" r="2.5" fill="#FFFBEE" opacity="0.9"/>
        <circle cx="52" cy="61" r="2" fill="#FFFBEE" opacity="0.82"/>
        <circle cx="64" cy="78" r="1.9" fill="#FFFBEE" opacity="0.72"/>
        <circle cx="47" cy="81" r="1.5" fill="#FFFBEE" opacity="0.62"/>
        <!-- the surface -->
        <path d="M30 55q12-3 24 0t24 0" fill="none" stroke="#FFF6DC" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
      </g>

      <!-- glass edge and highlight -->
      <path d="M41 37c0 4-7 5.5-7 13v22a11 11 0 0 0 11 11h18a11 11 0 0 0 11-11V50c0-7.5-7-9-7-13z" fill="none" stroke="#FFE8BE" stroke-width="1.7" stroke-linejoin="round" opacity="0.9"/>
      <path d="M39.6 45v15" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.5"/>
      <path d="M39.6 64v9" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.32"/>
    </g>
  </g>

  <g id="mono">
    <rect x="40" y="25" width="28" height="7.4" rx="3"/>
    <rect x="42.6" y="32" width="22.8" height="5.6" rx="1.6"/>
    <path fill-rule="evenodd" d="M41 37c0 4-7 5.5-7 13v22a11 11 0 0 0 11 11h18a11 11 0 0 0 11-11V50c0-7.5-7-9-7-13z
      M45 72a3.4 3.4 0 1 0 6.8 0 3.4 3.4 0 1 0-6.8 0
      M58.4 64.5a2.8 2.8 0 1 0 5.6 0 2.8 2.8 0 1 0-5.6 0
      M49.6 58.4a2.2 2.2 0 1 0 4.4 0 2.2 2.2 0 1 0-4.4 0"/>
  </g>
</svg>
